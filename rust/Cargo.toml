[package]
name = "aimodels"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
license = "MIT"
description = "A collection of AI model specifications across different providers, embedded in Rust"
authors = ["Dmitry Kury <d@dkury.com>"]
repository = "https://github.com/mitkury/aimodels"
homepage = "https://aimodels.dev"
documentation = "https://docs.rs/aimodels"
readme = "README.md"
keywords = ["ai", "llm", "models", "catalog", "openai"]
categories = ["development-tools", "science"]
build = "build.rs"
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/data/orgs.json",
    "/data/models/*.json",
    "/data/providers/*.json",
    "/README.md",
    "/LICENSE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
